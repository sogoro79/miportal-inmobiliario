<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Chat - HomeClick24</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .chat-wrap {
      max-width: 860px;
      margin: 30px auto;
      padding: 0 20px 80px;
    }

    .chat-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 70vh;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 20px;
      background: #fff;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-info {
      min-width: 0;
      flex: 1;
    }

    .chat-header-icon {
      width: 42px;
      height: 42px;
      background: #f0fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .chat-header-info strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: #222;
    }

    .chat-header-info small {
      color: #888;
      font-size: 0.8rem;
    }

    .chat-actions {
      margin-left: auto;
      flex-shrink: 0;
    }

    .chat-danger-btn,
    .msg-delete-btn {
      border: 1px solid #fecaca;
      background: #fff;
      color: #b91c1c;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }

    .chat-danger-btn {
      padding: 8px 12px;
      font-size: 0.82rem;
    }

    .msg-delete-btn {
      margin-top: 6px;
      padding: 4px 8px;
      font-size: 0.72rem;
      opacity: 0.9;
    }

    .me .msg-delete-btn {
      border-color: rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.18);
      color: #fff;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f9f9f9;
    }

    .msg {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.93rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .me {
      background: #7cc242;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .them {
      background: #fff;
      color: #222;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .msg-hora {
      font-size: 0.72rem;
      opacity: 0.65;
      margin-top: 4px;
      text-align: right;
    }

    .chat-vacio {
      text-align: center;
      color: #aaa;
      padding: 40px;
      font-size: 0.9rem;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #eee;
      padding: 12px;
      gap: 10px;
      background: #fff;
    }

    .chat-input input {
      flex: 1;
      padding: 11px 16px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: #7cc242;
    }

    .chat-input button {
      padding: 11px 22px;
      background: #7cc242;
      border: none;
      color: #fff;
      font-weight: 700;
      border-radius: 24px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .chat-input button:hover { background: #63a831; }

    .chat-input.disabled {
      background: #f3f4f6;
    }

    .chat-input.disabled input,
    .chat-input.disabled button {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .volver-chat {
      display: inline-block;
      color: #7cc242;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    .property-context {
      display: none;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid #e8e8e3;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
    }

    .property-context img {
      width: 96px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      background: #f3f4f6;
      flex-shrink: 0;
    }

    .property-context-info {
      min-width: 0;
      flex: 1;
    }

    .property-context-info strong {
      display: block;
      color: #222;
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .property-context-price {
      color: #7cc242;
      font-weight: 700;
      font-size: 0.92rem;
      margin-bottom: 3px;
    }

    .property-context-address {
      color: #777;
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .property-context-link {
      padding: 9px 14px;
      border-radius: 999px;
      background: #f0fae5;
      color: #5a9e2f;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .chat-wrap { padding: 0 10px 80px; margin: 10px auto; }
      .chat-container { height: calc(100vh - 180px); }
      .property-context { align-items: flex-start; }
      .property-context img { width: 82px; height: 66px; }
      .property-context-link { align-self: center; padding: 8px 10px; font-size: 0.8rem; }
    }

    @media (max-width: 480px) {
      .property-context { flex-wrap: wrap; }
      .property-context-info { flex-basis: calc(100% - 96px); }
      .property-context-link { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>

<div id="main-header"></div>
<script src="/js/header.js" defer></script>
<script src="/js/seo-slug.js"></script>

<div class="chat-wrap">
  <a href="javascript:history.back()" class="volver-chat">← Volver</a>
  <div class="property-context" id="propertyContext"></div>

  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-header-icon">💬</div>
      <div class="chat-header-info">
        <strong id="chatTitulo">Cargando...</strong>
        <small>Conversación sobre la propiedad</small>
      </div>
      <div class="chat-actions">
        <button type="button" class="chat-danger-btn" id="btnEliminarConversacion">Eliminar conversación</button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-vacio">Cargando mensajes...</div>
    </div>

    <div class="chat-input">
      <input id="mensajeInput" placeholder="Escribe un mensaje...">
      <button id="btnEnviar">Enviar</button>
    </div>
  </div>
</div>

<nav class="mobile-nav">
  <a href="/"><span>🏠</span><small>Inicio</small></a>
  <a href="/comprar"><span>🔍</span><small>Buscar</small></a>
  <a href="/favoritos"><span>❤️</span><small>Favoritos</small></a>
  <a href="/perfil#chats" class="active"><span>💬</span><small>Chats</small></a>
  <a href="/perfil"><span>👤</span><small>Perfil</small></a>
</nav>

<script>
const usuario       = JSON.parse(localStorage.getItem("usuario") || "null");
const token         = localStorage.getItem("token");
const conversacionId = new URLSearchParams(window.location.search).get("id");
let puedeResponderActual = true;

if (!usuario || !usuario._id || !token) location.replace("/login");
if (!conversacionId) location.replace("/perfil");

function direccionCorta(direccion = "") {
  return direccion.length > 90 ? direccion.slice(0, 87) + "..." : direccion;
}

function escapeHtml(value = "") {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#039;"
  })[char]);
}

function renderPropiedadContext(propiedad) {
  const cont = document.getElementById("propertyContext");
  if (!cont) return;
  if (!propiedad?._id) {
    cont.innerHTML = `
      <div class="property-context-info">
        <strong>Anuncio no disponible</strong>
        <div class="property-context-address">La publicación asociada ya no está disponible.</div>
      </div>
    `;
    cont.style.display = "flex";
    return;
  }

  const imagen = escapeHtml(propiedad.imagen || "https://via.placeholder.com/240x180?text=Sin+imagen");
  const precio = Number(propiedad.precio || 0).toLocaleString("es-ES");
  cont.innerHTML = `
    <img src="${imagen}" alt="">
    <div class="property-context-info">
      <strong>${escapeHtml(propiedad.titulo || "Propiedad")}</strong>
      <div class="property-context-price">${precio} €</div>
      <div class="property-context-address">${escapeHtml(direccionCorta(propiedad.direccion || ""))}</div>
    </div>
    <a class="property-context-link" href="${escapeHtml(typeof getPropiedadSeoUrl === "function" ? getPropiedadSeoUrl(propiedad) : `/propiedad/propiedad-${encodeURIComponent(propiedad._id)}`)}">Ver anuncio</a>
  `;
  cont.style.display = "flex";
}

/* ================================
   CARGAR INFO CONVERSACIÓN
================================ */
async function cargarConversacion() {
  try {
    const res  = await fetch(`/chat/conversaciones/${conversacionId}`, {
      headers: { "Authorization": "Bearer " + token }
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById("chatTitulo").textContent = "Conversación no disponible";
      desactivarEnvio("Esta conversación no está disponible");
      return;
    }
    const esAnunciante = String(data.anuncianteId) === String(usuario._id);
    const otroNombre = esAnunciante
      ? (data.compradorNombre || "Interesado")
      : (data.anuncianteNombre || "Anunciante");
    document.getElementById("chatTitulo").textContent = data.interlocutorEliminado ? "Usuario eliminado" : otroNombre;
    document.querySelector(".chat-header-info small").textContent = data.propiedadTitulo || "Anuncio no disponible";
    puedeResponderActual = data.puedeResponder !== false;
    if (!puedeResponderActual) desactivarEnvio(data.interlocutorEliminado ? "No se puede responder a un usuario eliminado" : "No se puede responder a esta conversación");
    renderPropiedadContext(data.propiedad);
  } catch(e) {}
}

function desactivarEnvio(mensaje) {
  const inputWrap = document.querySelector(".chat-input");
  const input = document.getElementById("mensajeInput");
  const btn = document.getElementById("btnEnviar");
  puedeResponderActual = false;
  inputWrap.classList.add("disabled");
  input.disabled = true;
  btn.disabled = true;
  input.placeholder = mensaje;
}

/* ================================
   CARGAR MENSAJES
================================ */
async function cargarMensajes() {
  try {
    const res      = await fetch(`/chat/conversaciones/${conversacionId}/mensajes`, {
      headers: { "Authorization": "Bearer " + token }
    });
    const mensajes = await res.json();
    const cont     = document.getElementById("chatMessages");

    if (!Array.isArray(mensajes) || !mensajes.length) {
      cont.innerHTML = `<div class="chat-vacio">Sé el primero en enviar un mensaje 👋</div>`;
      return;
    }

    cont.innerHTML = mensajes.map(m => {
      const esMio = String(m.userId) === String(usuario._id);
      const hora  = new Date(m.creado).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      return `
        <div class="msg ${esMio ? "me" : "them"}" data-mensaje-id="${escapeHtml(m._id)}">
          ${escapeHtml(m.texto)}
          <div class="msg-hora">${hora}</div>
          ${esMio ? `<button type="button" class="msg-delete-btn" data-delete-message="${escapeHtml(m._id)}">Eliminar mensaje</button>` : ""}
        </div>
      `;
    }).join("");

    cont.scrollTop = cont.scrollHeight;

    // Marcar mensajes como leídos
    fetch(`/chat/conversaciones/${conversacionId}/leer`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ userId: usuario._id })
    });

  } catch(e) {
    console.error(e);
  }
}

/* ================================
   ENVIAR MENSAJE
================================ */
async function enviarMensaje() {
  if (!puedeResponderActual) return;
  const input = document.getElementById("mensajeInput");
  const texto = input.value.trim();
  if (!texto) return;

  input.value = "";

  await fetch(`/chat/conversaciones/${conversacionId}/mensajes`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ userId: usuario._id, texto })
  });

  cargarMensajes();
}

async function eliminarMensaje(mensajeId) {
  if (!mensajeId) return;
  if (!confirm("Se eliminará este mensaje de la conversación. Los mensajes de la otra persona se conservan.")) return;

  const res = await fetch(`/chat/conversaciones/${conversacionId}/mensajes/${mensajeId}`, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  });
  if (res.ok) cargarMensajes();
}

async function eliminarConversacion() {
  if (!confirm("Se eliminará de tu historial. La otra persona podrá seguir conservando su copia.")) return;

  const res = await fetch(`/chat/conversaciones/${conversacionId}`, {
    method: "DELETE",
    headers: { "Authorization": "Bearer " + token }
  });
  if (res.ok) location.href = "/perfil#chats";
}

document.getElementById("btnEnviar").onclick = enviarMensaje;
document.getElementById("btnEliminarConversacion").onclick = eliminarConversacion;
document.getElementById("chatMessages").addEventListener("click", e => {
  const btn = e.target.closest("[data-delete-message]");
  if (btn) eliminarMensaje(btn.dataset.deleteMessage);
});
document.getElementById("mensajeInput").addEventListener("keydown", e => {
  if (e.key === "Enter") enviarMensaje();
});

/* ================================
   INIT
================================ */
cargarConversacion();
cargarMensajes();
setInterval(cargarMensajes, 3000);
</script>

</body>
</html>
